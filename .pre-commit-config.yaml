repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        language: system
        entry: cargo fmt --all --check
        pass_filenames: false
        types: [rust]

      - id: clippy
        name: clippy
        language: system
        entry: cargo clippy --all-targets --features bundled-duckdb -- -D warnings
        pass_filenames: false
        types: [rust]
