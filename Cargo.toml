[package]
name = "git-archaeologist"
version = "0.1.0"
edition = "2021"
description = "Fast CLI that extracts every interesting time series out of a git repository — LOC, cohort survival, coupling, hotspot, classify — as TSV/CSV/JSON/Parquet"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neumann-mlucas/git-archaeologist"
homepage = "https://github.com/neumann-mlucas/git-archaeologist"
readme = "README.md"
rust-version = "1.85"
keywords = ["git", "analytics", "cohort", "duckdb", "cli"]
categories = ["command-line-utilities", "development-tools"]
authors = ["neumann-mlucas <neumann.m.lucas@gmail.com>"]

[[bin]]
name = "git-archaeologist"
path = "src/main.rs"

[dependencies]
gix = { version = "0.66", default-features = false, features = [
    "max-performance-safe",
    "mailmap",
    "revision",
    "blob-diff",
] }

# Grammars pin against tree-sitter 0.23/0.24/0.25 LanguageFn ABI; core 0.26
# won't link older pins. Check the version before bumping.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-lua = "0.5"
tree-sitter-vim = "0.4"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-json = "0.24"
tree-sitter-php = "0.23"
tree-sitter-ocaml = "0.24"
tree-sitter-scala = "0.24"
tree-sitter-haskell = "0.23"
tree-sitter-md = "0.3"

# Unbundled: cargo dist links libduckdb at build time; `cargo install` from
# source needs libduckdb on host.
duckdb = "1"

rayon = "1"

# Direct dep (also transitive via gix) so we can build a custom Sink over blob pairs.
imara-diff = "0.1"

time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
clap = { version = "4", features = ["derive"] }

serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"

anyhow = "1"
thiserror = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# Tier 3 bench harness — peak-RSS via getrusage.
libc = "0.2"

[features]
# Opt-in test tiers per SPEC §Test strategy. See TASKS Phase 5.
e2e = []             # Tier 2 — clones ratatui once, runs smoke. Needs network first run.
bench-large = []    # Tier 3 — placeholder.

# CI helper: vendor + build libduckdb from source instead of dynamic-linking
# the host copy. Local `cargo install` still uses the unbundled path (SPEC
# §Distribution).
bundled-duckdb = ["duckdb/bundled"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
