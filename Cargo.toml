[package]
name = "git-archaeologist"
version = "0.1.0"
edition = "2021"
description = "Fast CLI that extracts every interesting time series out of a git repository — LOC, cohort survival, coupling, hotspot, classify — as TSV/CSV/JSON/Parquet"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neumann-mlucas/git-archaeologist"
homepage = "https://github.com/neumann-mlucas/git-archaeologist"
readme = "README.md"
rust-version = "1.85"
keywords = ["git", "analytics", "cohort", "duckdb", "cli"]
categories = ["command-line-utilities", "development-tools"]
authors = ["neumann-mlucas <neumann.m.lucas@gmail.com>"]

[[bin]]
name = "git-archaeologist"
path = "src/main.rs"

[dependencies]
# Git — pure-Rust, hunks + rename via blob_diff.
gix = { version = "0.66", default-features = false, features = [
    "max-performance-safe",
    "mailmap",
    "revision",
    "blob-diff",
] }

# Tree-sitter — every grammar that tracks the current 0.23/0.24/0.25
# LanguageFn API. Grammars pinned older than that don't link against
# tree-sitter 0.26. Additions are cheap at runtime (extension-map
# lookup) — only compile-time + binary size grows.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-lua = "0.5"
tree-sitter-vim = "0.4"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-json = "0.24"
tree-sitter-php = "0.23"
tree-sitter-ocaml = "0.24"
tree-sitter-scala = "0.24"
tree-sitter-haskell = "0.23"
tree-sitter-md = "0.3"

# Cache — OLAP columnar embedded engine. Unbundled: `cargo dist` runners
# link libduckdb at build time so end-user prebuilt binaries need nothing
# installed. `cargo install` fallback requires libduckdb on the host.
duckdb = "1"

# Concurrency
rayon = "1"
crossbeam-channel = "0.5"

# Diff — line hunks. Already transitive via gix; making it a direct dep so
# we can build a custom Sink over blob pairs.
imara-diff = "0.1"

# Time
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Config + serde
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"

# Errors
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[features]
# Opt-in test tiers per SPEC §Test strategy.
# `e2e` — Tier 2, clones a small public repo (ratatui) once into
# $XDG_CACHE_HOME/git-archaeologist-tests/ and runs correctness+perf smoke.
# Requires network on first run; reuses the clone thereafter.
e2e = []
# `bench-large` — Tier 3, mid/mid-large fixtures. Placeholder for now.
bench-large = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
